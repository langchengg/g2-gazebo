# All names, limits and motion parameters below are synthetic project settings.
# They do not describe a G2, and must never be copied to hardware configuration.
/**:
  ros__parameters:
    backend: mock
    enable_motion: false
    publish_hz: 10.0
    feedback_timeout: 0.6
    target_joint: mock_left_arm_joint1
    displacement: 0.05
    duration: 4.0
    max_displacement: 0.1
    max_velocity: 0.2
    max_acceleration: 0.5
    position_limit: 1.0
    watchdog_timeout: 0.5
    motion_timeout: 7.0
    position_tolerance: 0.002
    velocity_tolerance: 0.01
    stable_duration: 0.2
    tracking_time_constant: 0.08
    fault_mode: none
    fault_after: 0.5
