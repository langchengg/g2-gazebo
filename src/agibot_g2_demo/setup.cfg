[develop]
script_dir=$base/lib/agibot_g2_demo
[install]
install_scripts=$base/lib/agibot_g2_demo
[tool:pytest]
testpaths=test
python_files=test_*.py integration_test.py
junit_suite_name=agibot_g2_demo_python
markers=
    unit: Pure Python backend and motion state machine tests.
    integration: Real ROS 2 topics, services, executable identity and process cleanup.
addopts=-ra
