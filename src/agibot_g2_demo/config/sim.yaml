    motion_timeout: 180.0
/g2/telemetry:
  ros__parameters:
    backend: gazebo
    use_sim_time: true
    publish_hz: 10.0
    feedback_timeout: 3.0
    sim_feedback_timeout: 1.0
    sim_pause_timeout: 3.0
