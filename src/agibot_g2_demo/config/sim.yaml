    backend: gazebo
    use_sim_time: true
    enable_motion: false
    displacement: 0.05
    duration: 6.0
    max_acceleration: 0.5
    position_tolerance: 0.002
    velocity_tolerance: 0.01
    stable_duration: 0.2
    feedback_timeout: 3.0
