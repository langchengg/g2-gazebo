/g2/sim/controller_manager:
  ros__parameters:
    update_rate: 100
    use_sim_time: true
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController
/g2/sim/joint_state_broadcaster:
  ros__parameters:
    use_sim_time: true
    joints: [idx21_arm_l_joint1, idx22_arm_l_joint2, idx23_arm_l_joint3, idx24_arm_l_joint4, idx25_arm_l_joint5, idx26_arm_l_joint6, idx27_arm_l_joint7]
    interfaces: [position, velocity, effort]
    use_local_topics: false
/g2/sim/arm_controller:
  ros__parameters:
    use_sim_time: true
    joints: [idx21_arm_l_joint1, idx22_arm_l_joint2, idx23_arm_l_joint3, idx24_arm_l_joint4, idx25_arm_l_joint5, idx26_arm_l_joint6, idx27_arm_l_joint7]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    open_loop_control: false
    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 2.0
      idx21_arm_l_joint1: {trajectory: 0.1, goal: 0.002}
      idx22_arm_l_joint2: {trajectory: 0.1, goal: 0.002}
      idx23_arm_l_joint3: {trajectory: 0.1, goal: 0.002}
      idx24_arm_l_joint4: {trajectory: 0.1, goal: 0.002}
      idx25_arm_l_joint5: {trajectory: 0.1, goal: 0.002}
      idx26_arm_l_joint6: {trajectory: 0.1, goal: 0.002}
      idx27_arm_l_joint7: {trajectory: 0.1, goal: 0.002}
